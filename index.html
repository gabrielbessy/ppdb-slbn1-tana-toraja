
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPDB UPT SLB Negeri 1 Tana Toraja 2027/2028</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f1f5f2;color:#26352b}
header{background:#176b43;color:white;text-align:center;padding:30px 15px}
header h1{margin:8px 0;font-size:25px}
header p{margin:6px}
main{max-width:760px;margin:25px auto;padding:20px}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px #0001}
h2{color:#176b43;text-align:center}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:6px;font-size:15px}
button{width:100%;padding:14px;background:#176b43;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#pesan{margin-top:15px;padding:12px;border-radius:6px;display:none;white-space:pre-line}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
</style>
</head>
<body>
<header>
<p>PEMERINTAH PROVINSI SULAWESI SELATAN</p>
<p>DINAS PENDIDIKAN</p>
<h1>UPT SLB NEGERI 1 TANA TORAJA</h1>
<h3>PENERIMAAN PESERTA DIDIK BARU</h3>
<p>Tahun Pelajaran 2027/2028</p>
</header>

<main>
<div class="card">
<h2>FORMULIR PENDAFTARAN</h2>
<p>Silakan isi data calon peserta didik dengan benar.</p>

<form id="formPPDB">
<label>Nama Lengkap Calon Peserta Didik *</label>
<input name="nama_lengkap" required>

<label>Tempat Lahir</label>
<input name="tempat_lahir">

<label>Tanggal Lahir</label>
<input type="date" name="tanggal_lahir">

<label>Jenis Kelamin</label>
<select name="jenis_kelamin">
<option value="">Pilih jenis kelamin</option>
<option value="Laki-laki">Laki-laki</option>
<option value="Perempuan">Perempuan</option>
</select>

<label>Nama Orang Tua/Wali *</label>
<input name="nama_orang_tua" required>

<label>Nomor HP Orang Tua/Wali *</label>
<input type="tel" name="nomor_hp" required>

<label>Alamat Lengkap *</label>
<textarea name="alamat" rows="3" required></textarea>

<button type="submit" id="tombol">KIRIM PENDAFTARAN</button>
<div id="pesan" role="status" aria-live="polite"></div>
</form>
</div>
</main>

<footer>
UPT SLB Negeri 1 Tana Toraja<br>
Penerimaan Peserta Didik Baru Tahun 2027/2028
</footer>

<script>
const SUPABASE_URL = "https://mxyrgjdfcvgkvqjwcaij.supabase.co";
const SUPABASE_KEY = "sb_publishable_zknaBtImMptatqIpwPghnA_GOHcRWME";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("formPPDB");
const pesan = document.getElementById("pesan");
const tombol = document.getElementById("tombol");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  tombol.disabled = true;
  tombol.textContent = "Mengirim...";
  pesan.style.display = "none";

  const data = new FormData(form);
  const nomor = "PPDB-2027-" +
    Date.now().toString().slice(-8);

  const pendaftaran = {
    nomor_pendaftaran: nomor,
    nama_lengkap: data.get("nama_lengkap").trim(),
    tempat_lahir: data.get("tempat_lahir").trim() || null,
    tanggal_lahir: data.get("tanggal_lahir") || null,
    jenis_kelamin: data.get("jenis_kelamin") || null,
    nama_orang_tua: data.get("nama_orang_tua").trim(),
    nomor_hp: data.get("nomor_hp").trim(),
    alamat: data.get("alamat").trim()
  };

  try {
    const { error } = await supabaseClient
      .from("pendaftaran")
      .insert([pendaftaran]);

    if (error) throw error;

    pesan.style.display = "block";
    pesan.style.background = "#e1f5e8";
    pesan.style.color = "#176b43";
    pesan.textContent =
      "Pendaftaran berhasil dikirim!\n" +
      "Nomor pendaftaran: " + nomor +
      "\nSilakan simpan nomor pendaftaran ini.";
    form.reset();

  } catch (error) {
    pesan.style.display = "block";
    pesan.style.background = "#fde8e8";
    pesan.style.color = "#a11";
    pesan.textContent =
      "Pendaftaran belum berhasil dikirim.\n" +
      "Keterangan: " + error.message;
  } finally {
    tombol.disabled = false;
    tombol.textContent = "KIRIM PENDAFTARAN";
  }
});
</script>
</body>
</html>
